services:
  postgres:
    image: postgres:16-alpine
    container_name: blue-fox-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bluefox_finance}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bluefox_finance}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance-db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blue-fox-finance-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-bluefox_finance}?schema=public
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/auth/realms/blue-fox-global-group}
      # Criação de usuários pela tela Admin → Usuários (service account com manage-users/view-users)
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      # Bot do Telegram (opcional): sem token fica desligado
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-db
      - infra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blue-fox-finance
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - infra-net

networks:
  finance-db:
    driver: bridge
  infra-net:
    name: ${DOCKER_NETWORK:-infra-net}
    external: true
