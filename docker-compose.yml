services:
  postgres:
    image: postgres:16-alpine
    container_name: blue-fox-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bluefox_finance}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bluefox_finance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blue-fox-finance-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-bluefox_finance}?schema=public
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/auth/realms/blue-fox-global-group}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blue-fox-finance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - finance-net

networks:
  finance-net:
    driver: bridge
