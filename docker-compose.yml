services:
  postgres:
    image: postgres:16-alpine
    container_name: bluefox-spend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bluefox_spend}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bluefox_spend}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bluefox-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluefox-spend-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-bluefox_spend}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bluefox-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bluefox-spend-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - bluefox-net

networks:
  bluefox-net:
    driver: bridge
