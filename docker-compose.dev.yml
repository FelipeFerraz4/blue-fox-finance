services:
  postgres:
    ports:
      - "${DB_PORT:-5435}:5432"

  backend:
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${PORT:-3000}:3000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CONFIGURATION: development
    ports:
      - "${FRONTEND_PORT:-4200}:80"
