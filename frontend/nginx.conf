server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy para o backend NestJS
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback. O index.html sempre revalida: depois de um deploy ele
    # aponta para os novos chunks (com hash); uma cópia antiga em cache pediria
    # arquivos que não existem mais e as páginas lazy não abririam.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome (build de produção: main-ABC123.js, chunk-XYZ.js)
    # nunca mudam de conteúdo: cache longo
    location ~* "-[a-z0-9]{8,}\.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$" {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Demais estáticos (build de dev sem hash, favicon, imagens de assets/):
    # revalidam sempre (304 quando não mudaram), para nunca servir JS antigo
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        access_log off;
        add_header Cache-Control "no-cache";
    }
}
