# Sistema interno (atrás do login) e API fora do Google. Usa $request_uri porque o
# try_files troca o $uri por /index.html. Valor vazio = cabeçalho não enviado.
map $request_uri $robots_tag {
    default "";
    "~^/(dashboard|expenses|bills|payment-methods|stores|buyers|admin|api)(/|\?|$)" "noindex, nofollow";
    "~^/(lancamentos|analytics|analises|contas|meios-pagamento|lojas|compradores)(/|\?|$)" "noindex, nofollow";
}

# Endereços que o app atende no navegador (index.csr.html, status 200): sistema
# interno, URLs antigas e as sem idioma (o app redireciona para /pt ou /en). As
# páginas públicas são arquivos prontos do prerender (/pt/index.html, /en/about/index.html...).
# Qualquer outro endereço recebe status 404 e o app mostra a página "não encontrada".
map $request_uri $app_route {
    default 0;
    "~^/(\?|$)" 1;
    "~^/(home|about|updates)/?(\?|$)" 1;
    "~^/(dashboard|expenses|bills|payment-methods|stores|buyers|admin)(/|\?|$)" 1;
    "~^/(lancamentos|analytics|analises|contas|meios-pagamento|lojas|compradores)(/|\?|$)" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy para o backend NestJS
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Páginas públicas prontas (prerender) e, no resto, o app. O HTML sempre revalida:
    # depois de um deploy ele aponta para os novos chunks (com hash); uma cópia antiga
    # em cache pediria arquivos que não existem mais e as páginas lazy não abririam.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/index.html @app;
    }

    location @app {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_tag always;
        if ($app_route = 0) {
            return 404;
        }
        try_files /index.csr.html =404;
    }

    # 404 de verdade (bom para o Google), com o app mostrando a página "não encontrada"
    error_page 404 /index.csr.html;

    # Arquivos com hash no nome (build de produção: main-ABC123.js, chunk-XYZ.js)
    # nunca mudam de conteúdo: cache longo
    location ~* "-[a-z0-9]{8,}\.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$" {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Demais estáticos (build de dev sem hash, favicon, imagens de assets/):
    # revalidam sempre (304 quando não mudaram), para nunca servir JS antigo
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        access_log off;
        add_header Cache-Control "no-cache";
    }
}
