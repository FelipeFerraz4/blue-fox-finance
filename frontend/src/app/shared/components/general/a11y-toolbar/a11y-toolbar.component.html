<div class="a11y-root" [class.open]="open()">
  @if (open()) {
    <div class="a11y-bar" role="toolbar" [attr.aria-label]="'Acessibilidade' | t" id="a11y-bar">
      <button type="button" class="a11y-btn a11y-text" (click)="a11y.decreaseFont()" [disabled]="!a11y.canDecrease()"
        [attr.aria-label]="'Diminuir texto' | t" [title]="'Diminuir texto' | t">A<sup>-</sup></button>
      <button type="button" class="a11y-btn a11y-text" (click)="a11y.increaseFont()" [disabled]="!a11y.canIncrease()"
        [attr.aria-label]="'Aumentar texto' | t" [title]="'Aumentar texto' | t">A<sup>+</sup></button>
      <button type="button" class="a11y-btn" (click)="a11y.reset()" [disabled]="a11y.isDefault() && !a11y.speaking()"
        [attr.aria-label]="'Restaurar padrão' | t" [title]="'Restaurar padrão' | t">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></svg>
      </button>
      <button type="button" class="a11y-btn" (click)="a11y.toggleContrast()" [attr.aria-pressed]="a11y.highContrast()"
        [attr.aria-label]="'Alto contraste' | t" [title]="'Alto contraste' | t">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" class="fill"/></svg>
      </button>
      @if (a11y.speechSupported) {
        <button type="button" class="a11y-btn" (click)="a11y.toggleSpeech()" [attr.aria-pressed]="a11y.speaking()"
          [attr.aria-label]="a11y.speaking() ? ('Parar leitura' | t) : ('Ler em voz alta (seleção ou página)' | t)"
          [title]="a11y.speaking() ? ('Parar leitura' | t) : ('Ler em voz alta (seleção ou página)' | t)">
          @if (a11y.speaking()) {
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" class="fill"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="4 9 8 9 13 5 13 19 8 15 4 15" /><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          }
        </button>
      }
      <span class="a11y-sep" aria-hidden="true"></span>
      <button type="button" class="a11y-btn" (click)="theme.toggle()" [attr.aria-pressed]="theme.effective() === 'dark'"
        [attr.aria-label]="theme.effective() === 'dark' ? ('Usar tema claro' | t) : ('Usar tema escuro' | t)"
        [title]="theme.effective() === 'dark' ? ('Usar tema claro' | t) : ('Usar tema escuro' | t)">
        @if (theme.effective() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>
    </div>
  }

  <button type="button" class="a11y-fab" (click)="toggle()" [attr.aria-expanded]="open()" aria-controls="a11y-bar"
    [attr.aria-label]="open() ? ('Fechar opções de acessibilidade' | t) : ('Abrir opções de acessibilidade' | t)"
    [title]="open() ? ('Fechar acessibilidade' | t) : ('Acessibilidade' | t)">
    @if (open()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8" class="fill"/><path d="M5 8.5l7 1.5 7-1.5M12 10v4.5M12 14.5l-3.5 6M12 14.5l3.5 6"/></svg>
    }
  </button>
</div>
