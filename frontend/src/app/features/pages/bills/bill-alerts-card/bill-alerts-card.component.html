@if (items().length > 0) {
  <div class="bill-alerts" [class.has-overdue]="(alerts()?.atrasadas?.length ?? 0) > 0">
    <div class="bill-alerts-header">
      <strong>Contas a pagar</strong>
      <a routerLink="/bills" class="bill-alerts-link">Abrir</a>
    </div>
    <ul>
      @for (o of items(); track o.id) {
        <li [class]="'status-' + o.status">
          <span class="name">{{ o.nome }}</span>
          <span class="when">{{ label(o) }}</span>
          <span class="value">
            @if (o.valor !== null) {
              {{ o.valor | currency: 'BRL' }}
            } @else {
              —
            }
          </span>
        </li>
      }
    </ul>
  </div>
}
