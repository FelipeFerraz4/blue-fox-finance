<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Blue Fox Finance · Controle financeiro no site e no Telegram</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SEO padrão (robôs que não executam JS, como o preview do WhatsApp). O SeoService ajusta por rota. -->
  <meta name="description" content="Controle seus gastos com parcelamentos calculados pelo fechamento do cartão, contas a pagar com alertas, dashboard interativo e lançamentos pelo Telegram. Gratuito, do ecossistema Blue Fox.">
  <meta name="theme-color" content="#0b132b">
  <meta property="og:site_name" content="Blue Fox Finance">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blue Fox Finance · Controle financeiro no site e no Telegram">
  <meta property="og:description" content="Parcelamentos pelo fechamento do cartão, contas a pagar, dashboard e lançamentos pelo Telegram.">
  <meta property="og:url" content="https://finance.bluefoxglobalgroup.com/">
  <meta property="og:image" content="https://finance.bluefoxglobalgroup.com/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://finance.bluefoxglobalgroup.com/og-default.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tema e acessibilidade antes do Angular, para não piscar (ver ThemeService/AccessibilityService) -->
  <script>
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('bf-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (localStorage.getItem('bf-contrast') === 'high') d.setAttribute('data-contrast', 'high');
        var f = parseFloat(localStorage.getItem('bf-font-scale'));
        if (f >= 0.875 && f <= 1.5) d.style.setProperty('--a11y-font-scale', String(f));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
